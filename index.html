<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>탄성력 측정 실험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbit&display=swap');
        
        body {
            font-family: 'Inter', 'Orbit', sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Prevent pinch-zoom and scroll on touch devices */
        }

        /* Portrait Warning Overlay */
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex !important; }
            #app-container { display: none !important; }
        }

        /* Custom Styles for Lab Elements */
        .wood-texture {
            background: linear-gradient(to right, #8B5A2B, #A0522D, #8B5A2B);
            box-shadow: 2px 4px 10px rgba(0,0,0,0.5) inset;
        }

        .graph-paper {
            background-color: #f8fafc;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.2) 1px, transparent 1px),
                linear-gradient(rgba(59, 130, 246, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.5) 1px, transparent 1px);
            background-size: 10px 10px, 10px 10px, 50px 50px, 50px 50px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .digital-font {
            font-family: 'Orbit', monospace;
            text-shadow: 0 0 5px rgba(34, 197, 94, 0.7);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .error-shake { animation: shake 0.3s ease-in-out; }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #2d3748; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }

        .hidden-item { opacity: 0; pointer-events: none; transform: scale(0.8); transition: all 0.3s ease; }
        .visible-item { opacity: 1; pointer-events: auto; transform: scale(1); transition: all 0.3s ease; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col m-0 p-0 select-none">

    <!-- Custom Modal -->
    <div id="custom-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-60 transition-opacity duration-300">
        <div class="bg-gray-800 border border-gray-600 rounded-lg shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-transform duration-300 scale-95" id="custom-modal-content">
            <h3 class="text-lg font-bold text-white mb-2 text-center">알림</h3>
            <p id="custom-modal-text" class="text-gray-300 text-sm text-center mb-6">점이 두개 이상이어야 합니다.</p>
            <div class="flex justify-center">
                <button onclick="closeModal()" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded shadow active:scale-95 transition-all">확인</button>
            </div>
        </div>
    </div>

    <div id="portrait-warning" class="hidden fixed inset-0 z-50 bg-gray-900 flex-col items-center justify-center text-center p-6">
        <svg class="w-16 h-16 text-yellow-400 mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
        <h1 class="text-2xl font-bold text-white mb-2">화면을 가로로 돌려주세요</h1>
        <p class="text-gray-300">이 가상 실험은 가로 모드(Landscape)에 최적화되어 있습니다.</p>
    </div>

    <div id="app-container" class="flex w-full h-full p-2 gap-4 bg-gray-900 min-h-0 overflow-hidden">
        
        <!-- LEFT PANEL: Lab & Controls -->
        <div class="w-[55%] flex flex-col bg-gray-800 rounded-xl shadow-lg border border-gray-700 overflow-hidden relative min-h-0">
            
            <!-- Prompt Box -->
            <div class="bg-blue-900 bg-opacity-40 border-b border-blue-700 p-3 shadow-md shrink-0">
                <p id="prompt-text" class="text-blue-100 font-semibold text-center text-sm md:text-base transition-opacity duration-300">
                    용수철의 탄성력을 측정하기 위한 실험을 설계해보세요.
                </p>
            </div>

            <!-- Experiment Stage -->
            <div id="stage" class="flex-1 relative flex items-center justify-center overflow-hidden bg-gray-700 p-2 min-h-[120px]">
                
                <!-- Board -->
                <div id="stage-board" class="hidden-item absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[90%] h-[70%] wood-texture rounded-lg flex items-center justify-center">
                    
                    <!-- Graph Paper -->
                    <div id="stage-paper" class="hidden-item w-[95%] h-[90%] graph-paper rounded-sm relative flex items-center">
                        
                        <!-- Ruler (0cm to 20cm) aligned exactly with the sensor connection -->
                        <div id="ruler-line" class="absolute bottom-4 border-b-2 border-gray-500 z-0" style="left: 110px; right: 30px; height: 30px;">
                            <div class="absolute left-[0%] bottom-0 flex flex-col items-center -translate-x-1/2"><div class="h-3 w-0.5 bg-gray-600"></div><span class="text-[10px] text-gray-700 font-bold mt-1">0cm</span></div>
                            <div class="absolute left-[25%] bottom-0 flex flex-col items-center -translate-x-1/2"><div class="h-2 w-0.5 bg-gray-500"></div><span class="text-[10px] text-gray-600 mt-1">5</span></div>
                            <div class="absolute left-[50%] bottom-0 flex flex-col items-center -translate-x-1/2"><div class="h-3 w-0.5 bg-gray-600"></div><span class="text-[10px] text-gray-700 font-bold mt-1">10</span></div>
                            <div class="absolute left-[75%] bottom-0 flex flex-col items-center -translate-x-1/2"><div class="h-2 w-0.5 bg-gray-500"></div><span class="text-[10px] text-gray-600 mt-1">15</span></div>
                            <div class="absolute left-[100%] bottom-0 flex flex-col items-center -translate-x-1/2"><div class="h-3 w-0.5 bg-gray-600"></div><span class="text-[10px] text-gray-700 font-bold mt-1">20cm</span></div>
                        </div>
                        
                        <!-- Hook -->
                        <div id="stage-hook" class="hidden-item absolute w-4 h-8 bg-gray-400 rounded-full border-2 border-gray-300 shadow-md z-10 flex items-center justify-end" style="left: 15px;">
                            <div class="w-2 h-2 rounded-full bg-gray-700 mr-0.5"></div>
                        </div>

                        <!-- Spring SVG Container -->
                        <div id="stage-spring" class="hidden-item absolute h-12 flex items-center z-20 origin-left" style="left: 25px; width: 85px; padding-left: 10px;">
                            <svg class="w-full h-full drop-shadow-md" viewBox="0 0 100 20" preserveAspectRatio="none">
                                <path id="spring-path" d="M0,10 L5,10 L10,2 L15,18 L20,2 L25,18 L30,2 L35,18 L40,2 L45,18 L50,2 L55,18 L60,2 L65,18 L70,2 L75,18 L80,2 L85,18 L90,10 L100,10" 
                                      stroke="#94a3b8" stroke-width="3" fill="none" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
                            </svg>
                        </div>

                        <!-- Force Sensor -->
                        <div id="stage-sensor" class="hidden-item absolute z-30 flex items-center" style="left: 110px;">
                            <div class="w-3 h-6 border-2 border-gray-400 rounded-l-full -mr-1 z-0 bg-gray-500"></div>
                            <div id="sensor-body" class="w-28 h-14 bg-gray-800 border-2 border-gray-600 rounded-md shadow-[0_5px_15px_rgba(0,0,0,0.5)] flex flex-col items-center justify-center cursor-grab active:cursor-grabbing relative z-10">
                                <div class="text-[10px] text-gray-400 mb-0.5 uppercase tracking-wider">Force Sensor</div>
                                <div class="bg-black w-20 h-6 border border-gray-700 rounded flex items-center justify-center">
                                    <span id="digital-display" class="digital-font text-green-400 text-sm font-bold">0.0 N</span>
                                </div>
                                <div class="absolute right-[-10px] top-1/2 -translate-y-1/2 flex flex-col gap-1">
                                    <div class="w-1.5 h-6 bg-gray-500 rounded-full"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Inventory / Setup Tools -->
            <div id="inventory-area" class="h-16 bg-gray-800 border-t border-gray-700 flex items-center px-4 gap-2 overflow-x-auto custom-scroll shrink-0">
                <div class="text-xs text-gray-400 mr-2 font-semibold whitespace-nowrap">설치:</div>
                <button onclick="handleItemClick('board', this)" class="setup-btn px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded shadow-sm border border-gray-600 text-sm font-medium transition-colors shrink-0 flex items-center gap-1">
                    <span class="w-3 h-3 block rounded-sm" style="background: linear-gradient(to right, #8B5A2B, #A0522D);"></span> 나무판
                </button>
                <button onclick="handleItemClick('paper', this)" class="setup-btn px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded shadow-sm border border-gray-600 text-sm font-medium transition-colors shrink-0 flex items-center gap-1">
                    <span class="w-3 h-3 bg-white border border-blue-200 grid grid-cols-2 grid-rows-2"><span class="border-r border-b border-blue-100"></span><span class="border-b border-blue-100"></span><span class="border-r border-blue-100"></span><span></span></span> 모눈종이
                </button>
                <button onclick="handleItemClick('hook', this)" class="setup-btn px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded shadow-sm border border-gray-600 text-sm font-medium transition-colors shrink-0 flex items-center gap-1">
                    <span class="w-2.5 h-2.5 rounded-full border-2 border-gray-300 block"></span> 고리 나사못
                </button>
                <button onclick="handleItemClick('spring', this)" class="setup-btn px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded shadow-sm border border-gray-600 text-sm font-medium transition-colors shrink-0 flex items-center gap-1">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12h2l2-5 4 10 4-10 2 5h2"/></svg> 용수철
                </button>
                <button onclick="handleItemClick('sensor', this)" class="setup-btn px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded shadow-sm border border-gray-600 text-sm font-medium transition-colors shrink-0 flex items-center gap-1">
                    <span class="w-3 h-2 bg-gray-800 border border-green-500 rounded-sm block"></span> 힘 센서
                </button>
            </div>

            <!-- Bottom Controls (Active after setup) -->
            <div id="controls-area" class="h-16 py-2 bg-gray-900 border-t border-gray-700 flex items-center justify-between px-4 shrink-0 transition-opacity duration-500 opacity-50 pointer-events-none overflow-x-auto custom-scroll gap-2">
                <div class="flex gap-2 shrink-0">
                    <button id="btn-record" onpointerdown="recordData()" class="px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded shadow-md font-bold text-sm transition-all active:scale-95 flex items-center gap-1">
                        <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span> 기록
                    </button>
                    <!-- 변경된 버튼: 용수철 되돌리기 -->
                    <button id="btn-reset-spring" onclick="resetSpringPosition()" class="px-3 py-1.5 bg-gray-600 hover:bg-gray-500 text-white rounded shadow-md font-bold text-sm transition-all active:scale-95 flex items-center gap-1">
                        ↩️ 용수철 되돌리기
                    </button>
                    <button id="btn-swap" onclick="swapSpring()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded shadow-md font-bold text-sm transition-all active:scale-95">
                        용수철 변경 (<span id="current-spring-lbl">현재: A, 탄성계수 50N/m</span>)
                    </button>
                </div>
                <button onclick="resetExperiment()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 border border-gray-500 text-white rounded shadow-md font-bold text-sm transition-all active:scale-95 shrink-0 ml-auto">
                    실험 초기화
                </button>
            </div>
        </div>

        <!-- RIGHT PANEL: Graph & Results -->
        <div class="w-[45%] min-w-[320px] flex flex-col bg-gray-800 rounded-xl shadow-lg border border-gray-700 overflow-hidden relative min-h-0">
            
            <div class="bg-gray-900 p-3 border-b border-gray-700 flex justify-between items-center shrink-0">
                <h2 class="text-gray-100 font-bold text-sm">탄성력 그래프</h2>
                <!-- Disabled classes removed so it can trigger the modal -->
                <button id="btn-draw-graph" onclick="drawGraph()" class="px-3 py-1 bg-green-600 hover:bg-green-500 text-white rounded shadow-md font-bold text-xs transition-all active:scale-95">
                    그래프 그리기
                </button>
            </div>

            <!-- 그래프 컨테이너 영역: 정사각형(Square) 유지, 스크롤 추가, 정적 배치 -->
            <div class="flex-1 p-2 flex flex-col relative min-h-0 items-center overflow-y-auto custom-scroll w-full gap-4">
                
                <!-- Square Chart Wrapper -->
                <div class="relative bg-white rounded-md p-2 shadow-inner aspect-square w-full max-w-[85%] flex items-center justify-center shrink-0 mt-2">
                    <canvas id="elasticChart"></canvas>
                </div>
                
                <!-- Conclusion Box (No longer absolute, placed strictly below the graph) -->
                <div id="conclusion-box" class="w-full max-w-[85%] bg-yellow-100 border-l-4 border-yellow-500 p-3 rounded shadow-lg hidden opacity-0 transition-opacity duration-500 shrink-0 mb-4">
                    <h3 class="text-yellow-800 font-bold text-xs mb-1">📝 개념 정리</h3>
                    <p class="text-yellow-900 text-[11px] leading-snug">
                        탄성력의 크기는 용수철의 늘어난 길이에 비례하고, 그래프의 기울기가 급하면 급할 수록 탄성이 강한 용수철입니다.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const EXPECTED_SETUP_ORDER = ['board', 'paper', 'hook', 'spring', 'sensor'];
        let setupStep = 0;
        let currentSpring = 'A';
        let draggedDistance_cm = 0;
        const MAX_CM = 20;
        
        let graphDataA = [];
        let graphDataB = [];

        // Spring Configs: B is 2.5x harder to pull visually
        const springs = {
            'A': { k: 0.5, color: '#ef4444', name: '용수철 A (50N/m)', stroke: '#94a3b8', resistance: 1.0 },
            'B': { k: 1.0, color: '#3b82f6', name: '용수철 B (100N/m)', stroke: '#cbd5e1', resistance: 2.5 }
        };

        // --- Audio System ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSuccess() { initAudio(); playTone(600, 'sine', 0.1); setTimeout(() => playTone(800, 'sine', 0.15), 100); }
        function playError() { initAudio(); playTone(150, 'sawtooth', 0.3, 0.2); }
        function playRecord() { initAudio(); playTone(1000, 'sine', 0.1, 0.1); setTimeout(() => playTone(1500, 'sine', 0.2, 0.1), 100); }
        function playTick() { if(!audioCtx) return; playTone(300 + Math.random()*100, 'triangle', 0.05, 0.02); }
        function playSnap() { initAudio(); playTone(200, 'square', 0.1, 0.1); }

        // --- Chart.js Setup ---
        let elasticChart;
        function initChart() {
            const ctx = document.getElementById('elasticChart').getContext('2d');
            
            elasticChart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: springs['A'].name, data: graphDataA, backgroundColor: springs['A'].color, borderColor: springs['A'].color, borderWidth: 2, pointRadius: 5, showLine: false, tension: 0 },
                        { label: springs['B'].name, data: graphDataB, backgroundColor: springs['B'].color, borderColor: springs['B'].color, borderWidth: 2, pointRadius: 5, showLine: false, tension: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // Allows the canvas to fill the CSS aspect-square wrapper exactly
                    animation: { duration: 300 },
                    scales: {
                        x: {
                            type: 'linear', position: 'bottom', min: 0, max: 20,
                            title: { display: true, text: '늘어난 길이 (cm)', font: { family: 'Inter', weight: 'bold' } },
                            grid: { color: '#e2e8f0' }
                        },
                        y: {
                            min: 0, max: 20,
                            title: { display: true, text: '탄성력 (N)', font: { family: 'Inter', weight: 'bold' } },
                            grid: { color: '#e2e8f0' }
                        }
                    },
                    plugins: { legend: { position: 'top', labels: { font: { family: 'Inter' } } }, tooltip: { enabled: true } }
                }
            });
        }

        // --- Setup Logic ---
        const prompts = [
            "용수철의 탄성력을 측정하기 위한 실험을 설계해보세요.",
            "이제 용수철이 늘어난 길이를 알기 위해 무엇을 나무판 위에 붙여야 할까요?",
            "잘했습니다! 용수철을 고정시키기 위해 무엇이 필요할까요?",
            "이제 용수철을 고정시킬 수 있습니다. 고리 나사못에 무엇을 걸어야 할까요?",
            "이제 탄성력을 측정하기 위해서는 무엇이 필요할까요?",
            "세팅 완료! 힘 센서를 당긴 후, 그 자리에 둔 채로 기록 버튼을 누르세요."
        ];

        function handleItemClick(itemType, btnEl) {
            initAudio();
            if (setupStep >= 5) return;

            if (EXPECTED_SETUP_ORDER[setupStep] === itemType) {
                playSuccess();
                showStageItem(itemType);
                btnEl.classList.add('opacity-30', 'pointer-events-none');
                btnEl.classList.remove('hover:bg-gray-600');
                
                setupStep++;
                updatePrompt(prompts[setupStep]);
                if (setupStep === 5) completeSetup();
            } else {
                playError();
                btnEl.classList.add('error-shake');
                setTimeout(() => btnEl.classList.remove('error-shake'), 300);
            }
        }

        function showStageItem(itemType) {
            const el = document.getElementById(`stage-${itemType}`);
            if (el) { el.classList.remove('hidden-item'); el.classList.add('visible-item'); }
        }

        function updatePrompt(text) {
            const promptEl = document.getElementById('prompt-text');
            promptEl.style.opacity = 0;
            setTimeout(() => { promptEl.innerText = text; promptEl.style.opacity = 1; }, 300);
        }

        function completeSetup() {
            document.getElementById('inventory-area').classList.add('opacity-50', 'pointer-events-none');
            const controls = document.getElementById('controls-area');
            controls.classList.remove('opacity-50', 'pointer-events-none');
            controls.classList.add('opacity-100');
            initDrag();
        }

        // --- Measurement (Drag) Logic ---
        let isDragging = false;
        let startClientX = 0;
        let currentPxOffset = 0; // Tracks the actual stretched pixel amount
        let initialPxOffsetForDrag = 0; // Where the drag started from
        
        const sensorEl = document.getElementById('sensor-body');
        const sensorContainer = document.getElementById('stage-sensor');
        const springContainer = document.getElementById('stage-spring');
        const displayEl = document.getElementById('digital-display');
        let lastTickDistance = 0;

        function initDrag() {
            sensorEl.addEventListener('pointerdown', dragStart);
            window.addEventListener('pointermove', dragMove, {passive: false});
            window.addEventListener('pointerup', dragEnd);
        }

        function dragStart(e) {
            if (setupStep < 5) return;
            initAudio();
            isDragging = true;
            startClientX = e.clientX;
            initialPxOffsetForDrag = currentPxOffset;
            sensorEl.classList.add('scale-105', 'bg-gray-700');
            
            // Remove transitions during drag
            sensorContainer.style.transition = 'none';
            springContainer.style.transition = 'none';
        }

        function dragMove(e) {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling on touch devices
            
            const currentX = e.clientX;
            const deltaX = currentX - startClientX;
            
            // Apply spring resistance to mouse movement
            const effectiveDelta = deltaX / springs[currentSpring].resistance;
            
            let newPxOffset = initialPxOffsetForDrag + effectiveDelta;
            
            const rulerEl = document.getElementById('ruler-line');
            const maxPx = rulerEl ? rulerEl.clientWidth : 200; // Match 20cm exact ruler width
            
            // Clamping
            if (newPxOffset < 0) newPxOffset = 0;
            if (newPxOffset > maxPx) newPxOffset = maxPx;

            currentPxOffset = newPxOffset;
            draggedDistance_cm = (currentPxOffset / maxPx) * MAX_CM;
            
            updateVisuals(currentPxOffset, draggedDistance_cm);

            if (Math.abs(draggedDistance_cm - lastTickDistance) >= 0.5) {
                playTick();
                lastTickDistance = draggedDistance_cm;
            }
        }

        function dragEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            sensorEl.classList.remove('scale-105', 'bg-gray-700');
            // NOTICE: No snap back here. The sensor stays exactly where it was released.
        }

        function resetSpringPosition() {
            if (currentPxOffset === 0) return; // Already at 0
            
            playSnap();
            sensorContainer.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            springContainer.style.transition = 'width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            
            currentPxOffset = 0;
            draggedDistance_cm = 0;
            lastTickDistance = 0;
            
            updateVisuals(0, 0);
            
            // Clean up transitions after animation
            setTimeout(() => {
                sensorContainer.style.transition = 'none';
                springContainer.style.transition = 'none';
            }, 400);
        }

        function updateVisuals(pxDelta, cm) {
            sensorContainer.style.transform = `translateX(${pxDelta}px)`;
            springContainer.style.width = `${85 + pxDelta}px`; // Updated base width to 85px
            updateDisplay(cm);
        }

        function updateDisplay(cm) {
            const force = cm * springs[currentSpring].k;
            displayEl.innerText = `${force.toFixed(1)} N`; 
        }

        // --- Controls Logic ---
        function swapSpring() {
            initAudio();
            playTick();
            
            // Reverting spring to 0 before swapping for safety
            resetSpringPosition();
            
            currentSpring = currentSpring === 'A' ? 'B' : 'A';
            const springText = currentSpring === 'A' ? '현재: A, 탄성계수 50N/m' : '현재: B, 탄성계수 100N/m';
            document.getElementById('current-spring-lbl').innerText = springText;
            document.getElementById('spring-path').setAttribute('stroke', springs[currentSpring].stroke);
        }

        function recordData() {
            if (setupStep < 5) return;
            playRecord();
            const cm = parseFloat(draggedDistance_cm.toFixed(1));
            const force = parseFloat((cm * springs[currentSpring].k).toFixed(1));
            const point = { x: cm, y: force };
            
            if (currentSpring === 'A') {
                if(!graphDataA.some(p => Math.abs(p.x - cm) < 0.5)) graphDataA.push(point);
            } else {
                if(!graphDataB.some(p => Math.abs(p.x - cm) < 0.5)) graphDataB.push(point);
            }
            
            graphDataA.sort((a,b) => a.x - b.x);
            graphDataB.sort((a,b) => a.x - b.x);
            
            elasticChart.update();
            checkEnableDrawButton();
        }

        // Custom Modal Logic
        function showModal(msg) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            document.getElementById('custom-modal-text').innerText = msg;
            modal.classList.remove('hidden');
            void modal.offsetWidth; // trigger reflow
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function checkEnableDrawButton() {
            // Button is always visually enabled now, modal handles validation
        }

        function drawGraph() {
            // Check if current spring has at least 2 points
            const currentData = currentSpring === 'A' ? graphDataA : graphDataB;
            
            if (currentData.length < 2) {
                playError();
                showModal("점이 두개 이상이어야 합니다.");
                return;
            }

            playSuccess();
            
            // 데이터가 2개 이상일 때 선 보이기 활성화
            if (graphDataA.length >= 2) elasticChart.data.datasets[0].showLine = true;
            if (graphDataB.length >= 2) elasticChart.data.datasets[1].showLine = true;
            elasticChart.update();
            
            const box = document.getElementById('conclusion-box');
            // hidden 제거 후 opacity 적용을 위해 약간의 지연 사용
            box.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('opacity-0');
                box.classList.add('opacity-100');
            }, 10);
        }

        function resetExperiment() {
            initAudio();
            playTick();
            
            setupStep = 0;
            currentSpring = 'A';
            currentPxOffset = 0;
            draggedDistance_cm = 0;
            graphDataA.length = 0;
            graphDataB.length = 0;
            
            updatePrompt(prompts[0]);
            document.getElementById('current-spring-lbl').innerText = '현재: A, 탄성계수 50N/m';
            document.getElementById('spring-path').setAttribute('stroke', springs['A'].stroke);
            
            EXPECTED_SETUP_ORDER.forEach(item => {
                const el = document.getElementById(`stage-${item}`);
                if(el) { el.classList.remove('visible-item'); el.classList.add('hidden-item'); }
            });
            
            document.querySelectorAll('.setup-btn').forEach(btn => {
                btn.classList.remove('opacity-30', 'pointer-events-none');
                btn.classList.add('hover:bg-gray-600');
            });
            
            document.getElementById('inventory-area').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('controls-area').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('controls-area').classList.remove('opacity-100');
            
            sensorContainer.style.transition = 'none';
            springContainer.style.transition = 'none';
            updateVisuals(0, 0);
            
            elasticChart.data.datasets[0].showLine = false;
            elasticChart.data.datasets[1].showLine = false;
            elasticChart.update();
            
            const box = document.getElementById('conclusion-box');
            box.classList.add('hidden', 'opacity-0');
            box.classList.remove('opacity-100');
            
            sensorEl.removeEventListener('pointerdown', dragStart);
            window.removeEventListener('pointermove', dragMove);
            window.removeEventListener('pointerup', dragEnd);
        }

        // Init
        window.onload = initChart;
    </script>
</body>
</html>
